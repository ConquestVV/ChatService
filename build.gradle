plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
}

tasks.register('runChatServiceTests', JavaExec) {
    group = 'verification'
    description = 'Runs ChatService tests without external test frameworks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.netology.ChatServiceTestRunner'
}

test {
    dependsOn(tasks.named('runChatServiceTests'))
    doLast {
        if (!state.skipped) {
            println('ChatService tests executed via runChatServiceTests task.')
        }
    }
}
kotlin {
    jvmToolchain(21)
}
